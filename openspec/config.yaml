schema: spec-driven

context: |
  Документы проекта писать по-русски; служебные заголовки и ключевые слова
  формата OpenSpec сохранять в ожидаемом CLI виде.
  Перед планированием читать docs/architecture.md, корневой AGENTS.md
  и локальные AGENTS.md затрагиваемых приложений.
  Архитектура описывает согласованное направление разработки;
  наличие пути в ней не означает, что соответствующий код уже реализован.
  Один change может охватывать PWA и API. Приоритет MVP — закончить
  основной сценарий с минимальным набором зависимостей.
  Неопределённые продуктовые правила не считать согласованными:
  решения, влияющие на поведение или границы задачи, уточнять до реализации.

rules:
  proposal:
    - Указывать задачу Linear, цель, границы изменения и что в него не входит.
    - Отделять существующее поведение от предлагаемого; отмечать затронутые PWA, API и инфраструктуру.
  specs:
    - Описывать проверяемое поведение, входы, результаты и ошибки; технические решения помещать в design.md.
    - Для каждого требования приводить сценарии; учитывать подтверждение отправки текста и локальную обработку фото в затрагивающих их изменениях.
  design:
    - Сверять решения с docs/architecture.md и объяснять причины выбора.
    - При изменении постоянных архитектурных правил указывать необходимые обновления документации и локальных AGENTS.md.
    - Для изменений HTTP API описывать влияние на OpenAPI-контракт и потребителей.
    - В затрагивающих общее состояние и внешние зависимости изменениях учитывать гонки, тупики, идемпотентность, несколько экземпляров API, ограничение ресурсов и контролируемые ошибки при отказах.
    - Для повторяемых команд с побочными эффектами описывать Idempotency-Key, область уникальности, хранение результата в PostgreSQL, конфликты данных и поведение при неизвестном исходе внешней операции.
    - В затронутых сценариях учитывать границу клиента и сервера, секреты только на сервере, авторизацию объектов, валидацию недоверенных данных, безопасные логи и ограничения ресурсов по docs/architecture.md.
  tasks:
    - Каждую отслеживаемую задачу оформлять чекбоксом и указывать способ проверки выполнения.
    - Включать необходимые проверки и документацию в ту группу задач, которая меняет соответствующее поведение.
    - При настройке приложений и CI включать форматирование и линтинг по docs/architecture.md; для PWA также отдельную проверку типов TypeScript.
    - Добавлять тесты бизнес-правил и значимых сценариев; интеграционные тесты нужны для бизнес-инвариантов и транзакций, зависящих от БД. Не требовать теста на каждый компонент или техническую обёртку и не вводить целевой процент покрытия.
    - Для затронутой конкурентной бизнес-логики включать применимые проверки go test -race и сценарии сохранения инвариантов при параллельных запросах и отказах; не считать race detector проверкой гонок БД.
