name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  pwa:
    name: PWA checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/pwa/.nvmrc
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Use project npm version
        run: |
          npm_package_manager="$(node -p 'require("./package.json").packageManager')"
          npm install --global "$npm_package_manager"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check format, lint, FSD, types and tests
        run: npm run check
      - name: Build PWA
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

  api:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/tools/go.sum
      - name: Install Task
        run: |
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Check Go format
        run: task api:fmt:check
      - name: Lint Go
        run: task api:lint
      - name: Test with race detector
        run: task api:test:race
      - name: Build API and migrations
        run: task api:build
      - name: Audit Go dependencies
        run: task api:audit

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pwa
            context: .
            dockerfile: apps/pwa/Dockerfile
            target: runtime
          - image: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            target: api
          - image: migrate
            context: apps/api
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: postgres
            context: infra/postgres
            dockerfile: infra/postgres/Dockerfile
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for artifact transfer
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/delivery/go.mod
          cache: false
      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          docker build --pull
          --file "$DOCKERFILE"
          --target "$BUILD_TARGET"
          --platform linux/amd64
          --label "org.opencontainers.image.source=https://github.com/po-sostavu/app"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --tag "posostavu-${IMAGE}:ci"
          "$BUILD_CONTEXT"
      - name: Export checked image
        env:
          IMAGE: ${{ matrix.image }}
        run: go -C tools/delivery run ./cmd/release export "$IMAGE" "$GITHUB_SHA" "$RUNNER_TEMP/image"
      - name: Save image for integration checks and CD
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.image }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 7 || 1 }}

  delivery:
    name: Delivery integration
    needs: [docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/delivery/go.mod
          cache: false
      - name: Check delivery tools
        run: |
          test -z "$(gofmt -l tools/delivery)"
          go -C tools/delivery vet ./...
          go -C tools/delivery test -race ./...
          CGO_ENABLED=0 go -C tools/delivery build -trimpath -o "$RUNNER_TEMP/posostavu-deploy" ./cmd/deploy
      - name: Download checked images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images
      - name: Load and verify checked images
        run: go -C tools/delivery run ./cmd/release load "$RUNNER_TEMP/images" "$GITHUB_SHA"
      - name: Exercise isolated blue-green deployment and rollback
        env:
          TRAEFIK_TEST_IMAGE: traefik:v2.11.61@sha256:262ccbae7ee89fbc17b2ec1c2c4718b48d4b4a7a38c8c26a8593b074fdbc7844
        run: go -C tools/delivery run ./cmd/smoke "$GITHUB_WORKSPACE"

  ci:
    name: CI status
    if: ${{ always() }}
    needs: [pwa, api, docker, delivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          PWA_RESULT: ${{ needs.pwa.result }}
          API_RESULT: ${{ needs.api.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: |
          printf 'PWA: %s\nAPI: %s\nDocker: %s\n' "$PWA_RESULT" "$API_RESULT" "$DOCKER_RESULT"
          printf 'Delivery: %s\n' "$DELIVERY_RESULT"
          if [[ "$PWA_RESULT" != success || "$API_RESULT" != success || "$DOCKER_RESULT" != success || "$DELIVERY_RESULT" != success ]]; then
            echo '::error::All PWA, API, Docker and delivery checks must succeed.'
            exit 1
          fi
